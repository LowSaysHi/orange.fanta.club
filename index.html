<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fanta.club</title>
<meta name="description" content="Fanta.club – log in to access exclusive content.">
<meta name="theme-color" content="#18181b">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/profile.css">
<link rel="stylesheet" href="css/modal.css">
</head>
<body>
<header>
  <button class="logo" id="home" aria-label="Fanta.club home"><img src="assets/img/logo.png" alt="Fanta Cheats"></button>
  <nav aria-label="Main">
    <button data-go="home" class="on">Main</button><button data-go="soon">Forum</button><button data-go="soon">Showcases</button><button data-go="soon">About</button>
  </nav>
  <div class="right">
    <button class="ghost" id="lang" aria-label="Language">en ⌄</button>
    <button class="btn" id="login">Login</button>
    <div id="uw" style="display:none;position:relative"><button class="user" id="usr" aria-haspopup="true"><img class="av" src="assets/img/avatar.jpg" alt=""><span id="uname"></span> ⌄</button><div class="menu" id="menu"><button id="pf">Profile</button><button id="out">Log out</button></div></div>
  </div>
</header>
<div class="social" aria-label="Social links"><button data-go="soon" aria-label="Discord">💬</button><button data-go="soon" aria-label="YouTube">▶️</button><button data-go="soon" aria-label="TikTok">🎵</button><button data-go="soon" aria-label="Telegram">✈️</button></div>

<main id="view"></main>

<div class="back" id="back" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="modal">
    <button class="x" id="close" aria-label="Close">✕</button>
    <div class="l"><div class="crest"><img src="assets/img/logo.png" alt="Fanta Cheats"></div><div><h3>Welcome to <span>Fanta.club</span></h3><p>Log in with your credentials to access exclusive content. Here, we turn your passion for games into a unique and innovative experience. Have fun and play smart!</p></div></div>
    <div class="r">
      <h2 id="mt">Create an Account</h2>
      <div class="err" id="err" role="alert"></div>
      <input type="email" id="em" placeholder="E-mail" aria-label="E-mail" autocomplete="email">
      <input type="text" id="nn" placeholder="NickName" aria-label="NickName" autocomplete="username">
      <input type="password" id="pw" placeholder="Password" aria-label="Password" autocomplete="current-password">
      <label class="terms" id="tl"><input type="checkbox" id="tos"> I accept the <a href="#" onclick="return false">Terms of Service</a></label>
      <button class="btn full" id="submit">Create an Account</button>
      <button class="alt" id="swap">Already have an account? Join</button>
      <button class="disc">💬 Access our Discord</button>
      <div class="hint">For questions and support</div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
