*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
main{flex:1;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
:focus-visible{outline:2px solid var(--or2);outline-offset:2px}
header{display:flex;align-items:center;justify-content:space-between;padding:20px max(24px,calc((100% - 1100px)/2));border-bottom:1px solid var(--text);background:var(--bg)}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;color:var(--or);display:flex;gap:8px;align-items:center}
.logo b{color:#22c55e}
nav{display:flex;gap:20px;font-weight:600}
nav button{color:var(--text);padding:4px}
nav button.on{color:#b9753a}
.right{display:flex;gap:16px;align-items:center}
.btn{background:var(--or);color:var(--orfg);font-weight:600;padding:12px 18px;border-radius:6px}
.btn:hover{background:var(--or2)}
.ghost{color:var(--mute);padding:8px}
.user{display:flex;gap:8px;align-items:center;background:var(--panel);padding:6px 10px;border-radius:6px;font-weight:500}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;display:inline-block}
.social{position:fixed;left:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--or);border-left:0;border-radius:0 8px 8px 0;background:var(--bg2);z-index:5}
.social button{font-size:20px;opacity:.9}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 20px 220px;position:relative;overflow:hidden}
.pill{display:inline-flex;gap:10px;border:1px solid #6b3a14;border-radius:8px;padding:8px 10px;color:#b9753a;font-size:15px}
.pill b{color:#d8a066;font-weight:500}
.hero h2{margin:48px 0 0;color:var(--or);font-size:56px;letter-spacing:-3px;line-height:1}
.hero h1{margin:0;color:var(--or);font-size:clamp(64px,13vw,130px);letter-spacing:-6px;line-height:1.05;font-weight:800}
.hero p{max-width:440px;margin:28px auto;font-size:19px;font-weight:500;color:#f0c79c;line-height:1.5}
.orange{position:absolute;font-size:210px;right:max(8px,calc(50% - 680px));bottom:150px;transform:rotate(-6deg);filter:drop-shadow(0 12px 18px #0008)}
.glow{position:absolute;left:50%;bottom:-560px;width:1700px;height:760px;margin-left:-850px;border-radius:50%;background:radial-gradient(ellipse at top,#f97316 0,#a74a0a 25%,transparent 62%);border-top:3px solid #f97316}
@media(max-width:900px){.orange{display:none}.social{display:none}nav{display:none}.hero h2{font-size:36px}}
/* profile */
.me{width:100%;max-width:1100px;margin:0 auto;padding:70px 24px;text-align:center}
.big{width:128px;height:128px;border-radius:50%;border:3px solid var(--or);object-fit:cover;display:block;margin:0 auto 14px}
.me h2{margin:0;color:var(--or);font-size:32px}
.me .mail{color:var(--mute);margin:10px 0}
.row{display:flex;justify-content:center;gap:24px;margin:26px 0;color:var(--mute)}
.row button:hover{color:var(--text)}
.banner{margin-top:50px;height:224px;border-radius:8px;background:linear-gradient(90deg,#1a0a02,#c2410c 50%,#1a0a02);display:flex;align-items:center;justify-content:space-around;font-size:clamp(24px,5vw,52px);font-weight:800;color:#fff;padding:0 20px;position:relative}
.banner small{position:absolute;right:16px;bottom:10px;font-size:14px;font-weight:500}
.menu{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;z-index:15}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:6px}
.menu button:hover{background:var(--line)}
/* modal */
.back{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:20;padding:16px}
.back.open{display:grid}
.modal{display:grid;grid-template-columns:1fr 1fr;width:min(1024px,100%);background:var(--bg2);border:1px solid var(--or);border-radius:10px;position:relative;overflow:hidden}
.modal .l{padding:32px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;background:linear-gradient(180deg,#0000,#1f1f23)}
.crest{text-align:center;padding:24px 0}.crest img{width:min(280px,100%);height:auto}.logo img{height:64px;width:auto;display:block}
.modal h3{margin:0 0 6px;font-size:28px}.modal h3 span{color:var(--or)}
.modal .l p{font-size:14px;line-height:1.5;margin:0}
.modal .r{padding:32px}
.modal .r h2{margin:0 0 30px;font-size:30px}
.x{position:absolute;right:16px;top:12px;font-size:22px;color:var(--mute)}
input[type=text],input[type=email],input[type=password]{width:100%;height:50px;margin-bottom:24px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 16px;color:var(--text);font:inherit}
.terms{display:flex;gap:8px;align-items:center;font-size:14px;margin:-6px 0 20px}.terms a{color:var(--or)}
.full{width:100%;height:52px}
.alt{display:block;margin:26px auto;color:var(--or);font-size:15px}
.disc{width:100%;height:50px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-weight:500}
.hint{text-align:center;font-size:13px;color:var(--mute);margin-top:12px}
.err{color:#f87171;font-size:14px;min-height:20px;margin:-12px 0 10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--or);padding:12px 18px;border-radius:8px;z-index:30;display:none}
@media(max-width:760px){.modal{grid-template-columns:1fr}.modal .l{display:none}}
@media(prefers-reduced-motion:no-preference){.orange{animation:bob 5s ease-in-out infinite}@keyframes bob{50%{transform:rotate(-2deg) translateY(-10px)}}}
</style>
</head>

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function openModal(m){mode=m;var reg=m==='register';
  $('#mt').textContent=reg?'Create an Account':'Welcome back';
  $('#em').style.display=reg?'':'none';$('#tl').style.display=reg?'':'none';
  $('#submit').textContent=reg?'Create an Account':'Log in';
  $('#swap').textContent=reg?'Already have an account? Join':'New here? Create an account';
  $('#err').textContent='';$('#back').classList.add('open');(reg?$('#em'):$('#nn')).focus()}
function closeModal(){$('#back').classList.remove('open')}
function signedIn(){$('#login').style.display='none';$('#uw').style.display='';$('#uname').textContent=user.nick}
$('#login').onclick=function(){openModal('register')};
$('#close').onclick=closeModal;
$('#back').onclick=function(e){if(e.target.id==='back')closeModal()};
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
$('#swap').onclick=function(){openModal(mode==='register'?'login':'register')};
$('#submit').onclick=async function(){
  if(mode==='login'){var ln=$('#nn').value.trim(),lp=$('#pw').value,le=$('#err');await seed();var u=findUser(ln);if(!u||u.hash!==await sha(lp)){le.textContent='Wrong nickname or password.';return}user={nick:u.nick,email:u.email};save(SES,u.nick);signedIn();closeModal();profile();toast('Welcome back, '+u.nick+'!');return}
  var em=$('#em').value.trim(),nn=$('#nn').value.trim(),pw=$('#pw').value,err=$('#err');
  if(mode==='register'&&!/^\S+@\S+\.\S+$/.test(em)){err.textContent='Enter a valid e-mail address.';return}
  if(nn.length<3){err.textContent='Nickname needs at least 3 characters.';return}
  if(pw.length<8){err.textContent='Password needs at least 8 characters.';return}
  if(mode==='register'&&!$('#tos').checked){err.textContent='Accept the Terms of Service to continue.';return}
  if(findUser(nn)||findUser(em)){err.textContent='That nickname or e-mail is already taken.';return}
  var us=load(USR,{});us[nn]={nick:nn,email:em,hash:await sha(pw)};save(USR,us);
  user={nick:nn,email:em};save(SES,nn);signedIn();closeModal();profile();toast('Account created. Welcome, '+nn+'!');
};
$('#usr').onclick=function(e){e.stopPropagation();$('#menu').classList.toggle('open')};
$('#pf').onclick=function(){$('#menu').classList.remove('open');profile()};
$('#out').onclick=function(){$('#menu').classList.remove('open');user=null;save(SES,null);$('#uw').style.display='none';$('#login').style.display='';home();toast('Logged out')};
document.addEventListener('click',function(){$('#menu').classList.remove('open')});
$('#home').onclick=home;
document.addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(!b)return;
  if(b.dataset.go==='home')home();else toast('Coming soon')});
seed().then(function(){var s=load(SES,null),u=s&&findUser(s);if(u){user={nick:u.nick,email:u.email};signedIn();if(location.hash==='#me')profile();else home()}else home()});

</script>
